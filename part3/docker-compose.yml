services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: csvdb
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U lab -d csvdb"]
      interval: 3s
      timeout: 3s
      retries: 10

  loader:
    build: ./loader
    environment:
      DB_HOST: db
      DB_NAME: csvdb
      DB_USER: lab
      DB_PASSWORD: lab
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata: